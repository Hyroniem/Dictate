# Keeps the fork on the latest upstream release without anyone having to remember to.
#
# Once a day it looks for a release tag (vX.Y.Z) on DevEmperor/DictateKeyboard that main does not
# contain yet. When there is one, it does what FORK.md describes by hand: rebase the fork's commits onto
# that tag, build the result, and only then move main. A rebase that conflicts or a build that breaks
# leaves main untouched and opens an issue instead, so a bad release never lands on the phone silently.
#
# Needs a SYNC_TOKEN secret: a fine-grained personal access token for this repository with
# "Contents: read and write" and "Workflows: read and write". GITHUB_TOKEN cannot do this job, because
# rebased commits that touch .github/workflows/ count as editing workflows, which it is never allowed to
# push.
name: upstream-sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to rebase onto (empty = latest vX.Y.Z)
        type: string
        default: ''

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/DevEmperor/DictateKeyboard.git

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      base: ${{ steps.find.outputs.base }}
      branch: ${{ steps.rebase.outputs.branch }}
    steps:
      - name: Check for SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Repository secret SYNC_TOKEN is missing; see the header of upstream-sync.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Find a new upstream release
        id: find
        env:
          REQUESTED: ${{ inputs.tag }}
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --no-tags upstream '+refs/tags/v*:refs/tags/v*'
          if [ -n "$REQUESTED" ]; then
            TAG="$REQUESTED"
          else
            # Plain releases only: no wear-*, no -beta/-rc suffixes.
            TAG="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          fi
          git rev-parse --verify --quiet "$TAG^{commit}" > /dev/null || { echo "::error::No upstream tag $TAG"; exit 1; }
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "main already contains $TAG; nothing to do."
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebase the fork onto it
        id: rebase
        if: steps.find.outputs.tag != ''
        env:
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The old base is the merge-base, not the last tag: see "Rebasing onto a new upstream release"
          # in FORK.md for why.
          OLD_BASE="$(git merge-base HEAD "$TAG")"
          echo "Fork commits being carried over:"
          git log --oneline "$OLD_BASE..HEAD"
          # The fork is a handful of commits. Many more means the merge-base is not what it should be,
          # and replaying upstream's own history as fork commits is worse than stopping.
          COUNT="$(git rev-list --count "$OLD_BASE..HEAD")"
          if [ "$COUNT" -gt 60 ]; then
            echo "::error::$COUNT commits between the merge-base and main; expected only the fork's own."
            exit 1
          fi
          if ! git rebase --onto "$TAG" "$OLD_BASE"; then
            echo "::error::Rebase onto $TAG conflicts:"
            git status --short | grep -E '^(UU|AA|DU|UD) ' || true
            git rebase --abort
            exit 1
          fi
          BRANCH="sync/$TAG"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build:
    needs: rebase
    if: needs.rebase.outputs.branch != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.rebase.outputs.branch }}
    secrets: inherit

  promote:
    needs: [rebase, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      # The lease makes this refuse if main moved while the build ran; the next run picks it up then.
      # Pushing with SYNC_TOKEN (not GITHUB_TOKEN) also triggers the regular build on main, which is
      # where the APK to install comes from.
      - name: Move main onto the rebased fork
        env:
          BRANCH: ${{ needs.rebase.outputs.branch }}
          BASE: ${{ needs.rebase.outputs.base }}
        run: |
          git push --force-with-lease="main:$BASE" origin "HEAD:refs/heads/main"
          git push origin --delete "$BRANCH"

  report-failure:
    needs: [rebase, build, promote]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.rebase.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Upstream sync failed${TAG:+ for $TAG}"
          BODY="The automatic rebase onto the latest upstream release did not finish, so main was left as it was.

          Run: $RUN_URL

          Rebase it by hand as described in FORK.md, or fix what broke and run the upstream-sync workflow again."
          EXISTING="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
