# Fork CI: builds the fast-offline-fallback branch after every rebase onto a new upstream release.
#
# The point of this fork is a single small patch on top of DevEmperor/Dictate. The risk that comes with
# that shape is not a wrong feature — it is a rebase that silently stops compiling because upstream moved
# something the patch touches. So this runs on every push and says so immediately, and hands back an APK
# that can go straight onto a phone.
name: build

on:
  push:
    # sync/** is the upstream-sync workflow's staging branch; it builds that itself, through workflow_call.
    branches-ignore: ['sync/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to build (defaults to the triggering ref)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Well over a healthy run (~15 min), well under the six hours GitHub would otherwise let a hung
    # test hold the job for. A rebase check is worth nothing if the answer arrives tomorrow.
    timeout-minutes: 45
    env:
      # Lifted into env because the `secrets` context cannot be read from a step's `if:`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The build stamps the APK version with the short commit hash, which needs real history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Signing is optional. With a keystore in the repo secrets the APK upgrades in place on the phone
      # instead of needing an uninstall; without it the release build is simply unsigned, which
      # app/build.gradle.kts already handles by attaching no signing config at all.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Native libraries the build refuses to run without, and which are deliberately not committed:
      # sherpa-onnx (on-device STT) ships as reproducible release artifacts, and since v6.4 Bergamot
      # (on-device translation, :app:verifyBergamotLib) is compiled from Mozilla's sources. Cached on the
      # scripts that pin both, so a rebase that moves neither costs one restore instead of a 50 MB
      # download and a native build.
      - name: Cache vendored native libs
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
          key: native-${{ hashFiles('tools/fetch-sherpa-onnx.sh', 'tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Fetch sherpa-onnx libs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/fetch-sherpa-onnx.sh

      # The script wants the exact NDK and CMake that gradle/tools.versions.toml pins.
      - name: Build Bergamot
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          NDK_VERSION="$(grep '^ndk ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')"
          CMAKE_VERSION="$(grep '^cmake ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          tools/bergamot/build-android.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # :app only. A root assembleRelease also builds the Wear module, which costs four minutes and
      # produces an APK this workflow does not collect.
      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-fast-fallback-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Clean up signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
