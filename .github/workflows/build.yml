# Fork CI: builds the fast-offline-fallback branch after every rebase onto a new upstream release.
#
# The point of this fork is a single small patch on top of DevEmperor/Dictate. The risk that comes with
# that shape is not a wrong feature — it is a rebase that silently stops compiling because upstream moved
# something the patch touches. So this runs on every push and says so immediately, and hands back an APK
# that can go straight onto a phone.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lifted into env because the `secrets` context cannot be read from a step's `if:`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the APK version with the short commit hash, which needs real history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Signing is optional. With a keystore in the repo secrets the APK upgrades in place on the phone
      # instead of needing an uninstall; without it the release build is simply unsigned, which
      # app/build.gradle.kts already handles by attaching no signing config at all.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-fast-fallback-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Clean up signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
